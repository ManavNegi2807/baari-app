<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Baari Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF2EF; --card: #FFFFFF; --ink: #10241B; --muted: #4A6154; --faint: #6E8377; --line: #DCE6E0; --row: #F4F8F6;
  --brand: #12805A; --on-brand: #FFFFFF; --soft: #DCF1E6; --soft-ink: #0B5A3F; --nav: #0A1F17; --nav-ink: #BFD6CA;
  --ok: #17683F; --warn: #8A5A00; --warn-bg: #FFF1D0; --bad: #AE2F1B; --bad-bg: #FBE5E1; --grid: #E3ECE7;
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--nav); }
.lcard { width: 100%; max-width: 400px; background: var(--card); border-radius: 22px; padding: 28px; }
.lcard h1 { font: 800 28px/1.1 var(--font); letter-spacing: -0.02em; margin-top: 18px; }
.lcard p { color: var(--muted); margin-top: 6px; }
.brandrow { display: flex; align-items: center; gap: 10px; font: 800 21px/1 var(--font); letter-spacing: -0.02em; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.tag { font: 700 14px/1 var(--font); padding: 4px 8px; border-radius: 99px; background: var(--soft); color: var(--soft-ink); }
.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; font-size: 16px; margin-bottom: 5px; }
input, select, textarea { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; }
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 700; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.full { width: 100%; margin-top: 18px; }
.btn.ghost { background: var(--soft); color: var(--soft-ink); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 7px 12px; font-size: 16px; border-radius: 10px; }
.btn[disabled] { opacity: .55; cursor: default; }
.msg { margin-top: 12px; font-size: 16px; min-height: 20px; }
.msg.err { color: var(--bad); } .msg.good { color: var(--ok); }
.note { color: var(--faint); font-size: 15px; margin-top: 14px; }

/* shell */
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side { background: var(--nav); color: var(--nav-ink); padding: 18px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
.side .brandrow { color: #fff; padding: 4px 8px 16px; }
.side .tag { background: rgba(255,255,255,.14); color: #fff; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 0; background: none; color: var(--nav-ink); font-weight: 600; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav[aria-current="page"] { background: #fff; color: var(--nav); }
.side .me { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 16px; }
.side .me b { display: block; color: #fff; }
.side .me button { background: none; border: 0; color: var(--nav-ink); text-decoration: underline; cursor: pointer; padding: 6px 0 0; }
.main { padding: 26px clamp(16px, 3vw, 36px) 60px; min-width: 0; max-width: 1280px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { font: 800 30px/1.1 var(--font); letter-spacing: -0.02em; }
.head p { color: var(--muted); margin-top: 3px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tools input, .tools select { width: auto; min-width: 180px; padding: 8px 12px; }

/* tiles and cards */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tile span { display: block; color: var(--muted); font-size: 16px; }
.tile b { display: block; font: 700 32px/1.15 var(--font); letter-spacing: -0.02em; margin-top: 2px; }
.tile small { color: var(--faint); font-size: 15px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.card + .card { margin-top: 14px; } .grid2 .card + .card { margin-top: 0; }
.card h2 { font: 700 19px/1.25 var(--font); letter-spacing: -0.01em; }
.card .sub { color: var(--muted); font-size: 16px; margin-top: 2px; }
.cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--row); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 8px; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* charts */
.chart { position: relative; margin-top: 6px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart text { fill: var(--muted); font: 500 14px var(--font); }
.chart .bar { fill: var(--brand); }
.chart .hit:hover + .bar, .chart .hit.on + .bar { fill: #0B5A3F; }
.tip { position: absolute; pointer-events: none; background: var(--nav); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 15px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 3; }
.tip b { font-weight: 700; }
table.t { width: 100%; border-collapse: collapse; font-size: 16px; }
.t th { text-align: left; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--row); }
.t td.n, .t th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 14px; font-weight: 700; background: var(--soft); color: var(--soft-ink); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.off { background: #E6EAE8; color: #4A5650; }
.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.mrow { margin-top: 12px; } .mrow div { display: flex; justify-content: space-between; font-size: 16px; }
.list { list-style: none; } .list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 16px; }
.list li:last-child { border-bottom: 0; } .list span:last-child { color: var(--muted); text-align: right; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 16px; margin-top: 8px; } .kv dt { color: var(--muted); } .kv dd { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 14px 0; font-size: 16px; }
.drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--card); box-shadow: -10px 0 40px rgba(0,0,0,.18); z-index: 20; padding: 20px; overflow-y: auto; }
.scrim { position: fixed; inset: 0; background: rgba(10,31,23,.35); z-index: 19; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.top-mobile { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; gap: 4px; }
  .side .brandrow { width: 100%; padding-bottom: 6px; }
  .nav { width: auto; padding: 8px 12px; }
  .side .me { width: 100%; margin-top: 6px; display: flex; gap: 10px; align-items: baseline; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-clinic" viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 10h5a1 1 0 0 1 1 1v10M2 21h20M8 8v4M6 10h4"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>

  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
</svg>

<!-- login -->
<div class="login" id="loginView" hidden>
  <form class="lcard" id="lf" autocomplete="on">
    <div class="brandrow"><span class="logo"><svg class="i"><use href="#i-logo"/></svg></span>Baari <span class="tag">Company</span></div>
    <h1>Company login</h1>
    <p>For the Baari team only. Clinic and patient logins do not work here.</p>
    <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn full" id="lgo" type="submit">Log in</button>
    <div class="msg err" id="lmsg" role="alert"></div>
  </form>
</div>

<!-- app -->
<div class="shell" id="appView" hidden>
  <aside class="side">
    <div class="brandrow"><span class="logo"><svg class="i"><use href="#i-logo"/></svg></span>Baari <span class="tag">Company</span></div>
    <nav id="nav" style="display:contents">
      <button class="nav" data-tab="overview"><svg class="i"><use href="#i-home"/></svg>Overview</button>
      <button class="nav" data-tab="insights"><svg class="i"><use href="#i-spark"/></svg>Insights</button>
      <button class="nav" data-tab="clinics"><svg class="i"><use href="#i-clinic"/></svg>Clinics</button>
      <button class="nav" data-tab="patients"><svg class="i"><use href="#i-people"/></svg>Patients</button>
      <button class="nav" data-tab="portal"><svg class="i"><use href="#i-globe"/></svg>Patient portal</button>
      <button class="nav" data-tab="system"><svg class="i"><use href="#i-server"/></svg>System</button>
      <button class="nav" data-tab="settings"><svg class="i"><use href="#i-gear"/></svg>Settings and team</button>
      <button class="nav" data-tab="activity"><svg class="i"><use href="#i-log"/></svg>Activity</button>
    </nav>
    <div class="me"><b id="meName"></b><span id="meRole"></span><br><button id="out" type="button">Log out</button></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('en-IN');
const rupee = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const compact = (n) => (n >= 100000 ? (n / 100000).toFixed(n % 100000 ? 1 : 0) + 'L' : n >= 1000 ? (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'K' : String(n));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dshort = (iso) => { const [, m, d] = String(iso).split('-'); return `${Number(d)} ${MON[Number(m) - 1]}`; };
const when = (s) => { if (!s) return 'never'; const d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? esc(s) : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); };
const cap = (s) => String(s || '').replace(/^./, (c) => c.toUpperCase());
let me = null, tab = 'overview', cache = {};

async function api(path, opts) {
  const r = await fetch('/api/company' + path, { credentials: 'same-origin', ...(opts || {}), headers: { 'Content-Type': 'application/json' }, body: opts && opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('Log in to continue.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
const isAdmin = () => me && me.role === 'admin';

/* ---------- login ---------- */
function showLogin() { me = null; $('#appView').hidden = true; $('#loginView').hidden = false; history.replaceState(null, '', '/company/login'); }
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault(); const m = $('#lmsg'); m.textContent = ''; $('#lgo').disabled = true;
  try { me = await api('/login', { method: 'POST', body: { username: $('#u').value, password: $('#pw').value } }); $('#pw').value = ''; start(); }
  catch (err) { m.textContent = err.message; } finally { $('#lgo').disabled = false; }
});
$('#out').onclick = async () => { try { await api('/logout', { method: 'POST' }); } catch {} showLogin(); };
async function boot() { try { me = await api('/me'); start(); } catch { showLogin(); } }
function start() {
  $('#loginView').hidden = true; $('#appView').hidden = false; history.replaceState(null, '', '/company');
  $('#meName').textContent = me.name; $('#meRole').textContent = me.role === 'admin' ? 'Admin' : 'View only';
  go(tab);
}

/* ---------- tabs ---------- */
document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));
async function go(t) {
  tab = t; closeDrawer();
  document.querySelectorAll('.nav').forEach((b) => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const main = $('#main'); main.innerHTML = '<p class="empty">Loading…</p>';
  try { await VIEWS[t](main); } catch (err) { if (err.message !== 'Log in to continue.') main.innerHTML = `<p class="empty" role="alert">${esc(err.message)}</p>`; }
  window.scrollTo(0, 0);
}
const head = (title, sub, tools = '') => `<div class="head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="tools">${tools}</div></div>`;
const tile = (label, value, small = '') => `<div class="tile"><span>${esc(label)}</span><b>${value}</b>${small ? `<small>${esc(small)}</small>` : ''}</div>`;
const healthPill = (c) => `<span class="pill ${c.health === 'warn' ? 'bad' : c.health === 'quiet' ? 'warn' : c.health === 'off' ? 'off' : ''}">${esc(c.why)}</span>`;

/* ---------- bar chart (single series, brand green, thin rounded bars, hover tooltip, table view) ---------- */
function niceMax(v) { if (v <= 4) return 4; const p = 10 ** Math.floor(Math.log10(v)); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function barChart(el, data, { unit = 'bookings', every = 7, fmt = (d) => d.label } = {}) {
  const W = 520, H = 210, L = 40, B = 30, T = 18, R = 6, n = data.length;
  const max = niceMax(Math.max(...data.map((d) => d.v), 0)), plotW = W - L - R, plotH = H - T - B, slot = plotW / n, bw = Math.min(24, slot - 6);
  const y = (v) => T + plotH - (v / max) * plotH;
  let g = '';
  for (const t of [0, max / 2, max]) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${compact(Math.round(t))}</text>`;
  const top = data.reduce((m, d, i) => (d.v > data[m].v ? i : m), 0);
  data.forEach((d, i) => {
    const cx = L + slot * i + slot / 2, h = Math.max(d.v ? 2 : 0, (d.v / max) * plotH), x = cx - bw / 2, yy = T + plotH - h, r = Math.min(4, bw / 2, h);
    g += `<rect class="hit" data-i="${i}" x="${L + slot * i}" y="${T}" width="${slot}" height="${plotH + B - 6}" fill="transparent"/>`;
    if (h > 0) g += `<path class="bar" d="M${x},${T + plotH} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${T + plotH} Z" pointer-events="none"/>`;
    if (i % every === every - 1 || i === 0 && n <= 8) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
    if (i === top && d.v > 0) g += `<text x="${cx}" y="${yy - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${d.v}</text>`;
  });
  const id = 'c' + Math.random().toString(36).slice(2, 7);
  el.innerHTML = `<div class="cardhead" style="margin:0"><span></span><div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="true" data-v="chart">Chart</button><button type="button" aria-pressed="false" data-v="table">Table</button></div></div>
    <div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} chart">${g}</svg><div class="tip" hidden></div></div>
    <div class="scroll" hidden><table class="t"><thead><tr><th>${n > 20 ? 'Day' : 'Week'}</th><th class="n">${esc(cap(unit))}</th></tr></thead><tbody>${data.map((d) => `<tr><td>${esc(fmt(d))}</td><td class="n">${d.v}</td></tr>`).join('')}</tbody></table></div>`;
  const box = $('#' + id), tip = $('.tip', box), svg = $('svg', box);
  svg.addEventListener('mousemove', (e) => {
    const h = e.target.closest('.hit'); if (!h) { tip.hidden = true; return; }
    const d = data[+h.dataset.i], r = svg.getBoundingClientRect(), k = r.width / W;
    tip.innerHTML = `${esc(fmt(d))}<br><b>${d.v}</b> ${esc(unit)}`; tip.hidden = false;
    tip.style.left = ((+h.getAttribute('x') + slot / 2) * k) + 'px'; tip.style.top = (y(d.v) * k - 4) + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.hidden = true; });
  el.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
    el.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b)); const t = b.dataset.v === 'table';
    box.hidden = t; $('.scroll', el).hidden = !t;
  }));
}

/* ---------- views ---------- */
const VIEWS = {};
VIEWS.overview = async (main) => {
  const [o, cl] = await Promise.all([api('/overview'), api('/clinics')]); const k = o.kpi;
  main.innerHTML = head('Overview', 'How Baari is doing across every clinic and the patient portal.') +
    `<div class="tiles">
      ${tile('Active clinics', num(k.active), k.suspended ? `${k.suspended} suspended` : `${k.clinics} in total`)}
      ${tile('Bookings this week', num(k.week), `${num(k.today)} today, ${num(k.next7)} coming up`)}
      ${tile('Booked through portal', k.portal_share + '%', 'of all bookings')}
      ${tile('Patients', num(k.patients), `${num(k.accounts)} with an account`)}
      ${tile('No-show rate', k.no_show_rate + '%', 'past visits, all clinics')}
      ${tile('Monthly revenue', k.mrr === null ? '<span style="font-size:19px;font-weight:600;color:var(--muted)">Not set</span>' : rupee(k.mrr), k.mrr === null ? 'Add plan prices in Settings' : `from ${k.priced} priced clinic${k.priced === 1 ? '' : 's'}`)}
    </div>
    <div class="grid2">

        ${s.whatsapp_log.length ? `<h2 style="margin-top:16px;font-size:17px">Reminder results</h2>${kv(s.whatsapp_log.map((l) => [esc(cap(l.k)), l.n]))}` : ''}</section>
    </div>
    <section class="card" style="margin-top:14px"><h2>Clinic logins</h2><p class="sub">Staff accounts that can open clinic desks. A login tied to a clinic sees only that clinic. "All clinics" is an older login: replace it with logins made on each clinic. Passwords are never shown.</p><div class="scroll"><table class="t"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Sees</th><th>Created</th></tr></thead><tbody>${s.clinic_logins.map((u) => `<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(cap(u.role))}</td><td>${u.clinic ? esc(u.clinic) : '<span class="pill warn">All clinics</span>'}</td><td>${when(u.created_at)}</td></tr>`).join('')}</tbody></table></div></section>`;
};

VIEWS.settings = async (main) => {
  const [st, team] = await Promise.all([api('/settings'), api('/team')]);
  const ro = isAdmin() ? '' : ' disabled';
  main.innerHTML = head('Settings and team', 'Plan prices, who can open this site, and your own password.') +
    `<div class="grid2" style="margin-top:0">
      <section class="card"><h2>Plan prices</h2><p class="sub">Monthly price per clinic, in rupees. Used to work out monthly revenue on the Overview.</p>
        <form id="pf">${st.plans.map((p) => `<div class="field"><label for="pr-${p}">${cap(p)}</label><input id="pr-${p}" type="number" min="0" step="1" inputmode="numeric" value="${st.prices[p] ?? ''}" placeholder="Not set"${ro}></div>`).join('')}
        ${isAdmin() ? '<button class="btn full" type="submit">Save prices</button>' : '<p class="note">View-only access.</p>'}<div class="msg" id="pm" role="status"></div></form></section>
      <section class="card"><h2>Your password</h2><p class="sub">At least 10 characters.</p>
        <form id="wf"><div class="field"><label for="w1">Current password</label><input id="w1" type="password" autocomplete="current-password" required></div><div class="field"><label for="w2">New password</label><input id="w2" type="password" autocomplete="new-password" minlength="10" required></div>
        <button class="btn full" type="submit">Change password</button><div class="msg" id="wm" role="status"></div></form></section>
    </div>
    <section class="card" style="margin-top:14px"><h2>Baari team</h2><p class="sub">Admins can change anything. View-only people can look but not change.</p>
      <div class="scroll"><table class="t"><thead><tr><th>Name</th><th>Username</th><th>Access</th><th>Added</th><th></th></tr></thead><tbody>${team.map((u) => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td><span class="pill ${u.role === 'admin' ? '' : 'off'}">${u.role === 'admin' ? 'Admin' : 'View only'}</span></td><td>${when(u.created_at)}</td><td class="n">${isAdmin() ? `<button class="btn ghost sm" data-reset="${u.id}" data-name="${esc(u.username)}">Reset password</button> ${u.id !== me.id ? `<button class="btn danger sm" data-del="${u.id}" data-name="${esc(u.username)}">Remove</button>` : ''}` : ''}</td></tr>`).join('')}</tbody></table></div>
      ${isAdmin() ? `<h2 style="margin-top:18px;font-size:17px">Add a team member</h2><form id="tf"><div class="row2"><div class="field"><label for="tn">Name</label><input id="tn" required maxlength="80"></div><div class="field"><label for="tu">Username</label><input id="tu" required autocapitalize="none" spellcheck="false"></div></div>
        <div class="row2"><div class="field"><label for="tp">Password</label><input id="tp" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="tr">Access</label><select id="tr"><option value="viewer">View only</option><option value="admin">Admin</option></select></div></div>
        <button class="btn" style="margin-top:14px" type="submit">Add member</button><div class="msg" id="tm" role="status"></div></form>` : ''}</section>`;
  const say = (id, ok, t) => { const m = $(id); m.className = 'msg ' + (ok ? 'good' : 'err'); m.textContent = t; };
  $('#pf').onsubmit = async (e) => { e.preventDefault(); if (!isAdmin()) return; try { const prices = {}; st.plans.forEach((p) => { prices[p] = $('#pr-' + p).value; }); await api('/settings', { method: 'PUT', body: { prices } }); say('#pm', 1, 'Saved.'); } catch (err) { say('#pm', 0, err.message); } };
  $('#wf').onsubmit = async (e) => { e.preventDefault(); try { await api('/password', { method: 'PUT', body: { current: $('#w1').value, next: $('#w2').value } }); $('#w1').value = $('#w2').value = ''; say('#wm', 1, 'Password changed.'); } catch (err) { say('#wm', 0, err.message); } };
  const tf = $('#tf');
  if (tf) tf.onsubmit = async (e) => { e.preventDefault(); try { await api('/team', { method: 'POST', body: { name: $('#tn').value, username: $('#tu').value, password: $('#tp').value, role: $('#tr').value } }); go('settings'); } catch (err) { say('#tm', 0, err.message); } };
  main.querySelectorAll('[data-reset]').forEach((b) => b.onclick = async () => { const pw = prompt(`New password for ${b.dataset.name} (at least 10 characters):`); if (!pw) return; try { await api(`/team/${b.dataset.reset}/password`, { method: 'PUT', body: { password: pw } }); alert('Password reset. They are logged out.'); } catch (err) { alert(err.message); } });
  main.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => { if (!confirm(`Remove ${b.dataset.name}?`)) return; try { await api('/team/' + b.dataset.del, { method: 'DELETE' }); go('settings'); } catch (err) { alert(err.message); } });
};

VIEWS.activity = async (main) => {
  const rows = await api('/activity');
  main.innerHTML = head('Activity', 'Who did what on this site. The latest 100 entries.') +
    `<section class="card"><div class="scroll">${rows.length ? `<table class="t"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>${rows.map((r) => `<tr><td style="white-space:nowrap">${when(r.created_at)}</td><td>${esc(r.who)}</td><td>${esc(r.action)}</td><td style="color:var(--muted)">${esc(r.detail || '')}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">Nothing yet.</p>'}</div></section>`;
};

boot();
</script>
</body>
</html>
